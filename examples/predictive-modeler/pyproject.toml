[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictive-modeler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "recurse-sdk==0.1.4",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "pyarrow==25.0.1",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "joblib==1.6.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
include = ["agent.yaml", "prompt.md", "tools.py", "modeler", "inputs", "README.md", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["modeler"]

apiVersion: recurse.tools/v1alpha1
kind: ToolService
metadata:
  name: company-updates
  title: Company product updates
  summary: Collect official update evidence for Linear, Notion and ClickUp using bounded paid reads.
runtime:
  python: '3.14'
  lockfile: uv.lock
tools:
  source: company_updates.py
  register:
    company_updates:
      description: Search for recent official updates and fetch one page per company, returning short evidence excerpts.
      apis: [exa.web.search, firecrawl.web.scrape]
      input_schema:
        type: object
        properties:
          start_date: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
          end_date: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        required: [start_date, end_date]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          window:
            type: object
            properties:
              start: {type: string}
              end: {type: string}
            required: [start, end]
            additionalProperties: false
          companies:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: object
              properties:
                company: {type: string, enum: [Linear, Notion, ClickUp]}
                missing_reason: {type: [string, 'null'], enum: [no_official_result, no_markdown, target_error, null]}
                source:
                  type: [object, 'null']
                  properties:
                    url: {type: string}
                    title: {type: string}
                    published_date: {type: [string, 'null']}
                    excerpt: {type: string, maxLength: 1200}
                  required: [url, title, published_date, excerpt]
                  additionalProperties: false
              required: [company, source, missing_reason]
              additionalProperties: false
        required: [window, companies]
        additionalProperties: false
      pricing:
        provider_basis_micro_usd: 0
        compute_basis_micro_usd: 0
        provider_multiplier: 1
        compute_multiplier: 4

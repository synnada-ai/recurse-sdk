[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rna-fold-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["ViennaRNA==2.7.2"]

[tool.hatch.build.targets.sdist]
include = ["agent.yaml", "prompt.md", "rna_fold_tools.py", "uv.lock"]

[tool.hatch.build.targets.wheel]
include = ["agent.yaml", "prompt.md", "rna_fold_tools.py"]

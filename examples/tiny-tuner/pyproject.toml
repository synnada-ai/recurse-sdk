[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-tuner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["recurse-sdk>=0.1.7,<0.2", "torch==2.14.0", "torchvision==0.29.0"]

[tool.hatch.build.targets.sdist]
include = ["agent.yaml", "prompt.md", "tools.py", "uv.lock"]
exclude = ["tests/**"]

[tool.hatch.build.targets.wheel]
include = ["agent.yaml", "prompt.md", "tools.py"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { url = "https://download.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp314-cp314-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.14' and platform_machine == 'x86_64'" },
  { url = "https://download.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp314-cp314-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and python_version == '3.14' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and (python_version != '3.14' or (platform_machine != 'x86_64' and platform_machine != 'aarch64'))" }
]
torchvision = [
  { url = "https://download.pytorch.org/whl/cpu/torchvision-0.29.0%2Bcpu-cp314-cp314-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.14' and platform_machine == 'x86_64'" },
  { url = "https://download.pytorch.org/whl/cpu/torchvision-0.29.0%2Bcpu-cp314-cp314-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and python_version == '3.14' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and (python_version != '3.14' or (platform_machine != 'x86_64' and platform_machine != 'aarch64'))" }
]

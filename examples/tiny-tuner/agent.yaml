apiVersion: recurse.run/v1alpha1
kind: Agent
metadata:
  name: tiny-tuner
  title: Tiny MNIST Network Search
  summary: Finds smaller neural networks meeting a target MNIST cross-validation accuracy.
runtime:
  python: "3.14"
  lockfile: uv.lock
agent:
  model: gpt-5.6-luna
  prompt: prompt.md
  timeout_tools: 660
inputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    target_accuracy:
      type: number
      minimum: 0
      maximum: 1
      default: 0.99
      description: Required arithmetic mean accuracy across the configured CV splits.
    max_seconds:
      type: number
      exclusiveMinimum: 0
      maximum: 600
      default: 300
      description: Shared wall-clock allowance starting with the first profile or evaluation.
    max_trials:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
      description: Additional cap on attempted recipes, including failures and timeouts.
    max_epochs:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      description: Maximum training epochs per fold of a candidate.
    cv_folds:
      type: integer
      minimum: 2
      maximum: 5
      default: 3
      description: Folds per K-fold repetition within MNIST's training split; ignored for holdout.
    cv_method:
      type: string
      enum: [stratified_kfold, kfold, stratified_holdout]
      default: stratified_kfold
      description: Evaluation method, fixed for the entire run.
    cv_repeats:
      type: integer
      minimum: 1
      maximum: 5
      default: 1
      description: Independent deterministic split repetitions on the same selected examples.
    validation_fraction:
      type: number
      minimum: 0.05
      maximum: 0.5
      default: 0.2
      description: Per-class validation fraction for stratified_holdout; ignored for K-fold.
    cv_seed:
      type: integer
      minimum: 0
      maximum: 2147483647
      default: 7
      description: Seed for selecting examples and splitting folds, separate from training seed.
    samples:
      type: integer
      minimum: 100
      maximum: 60000
      multipleOf: 10
      default: 60000
      description: Training examples used for CV; smaller values balance classes subject to available counts.
    seed:
      type: integer
      minimum: 0
      maximum: 2147483647
      default: 7
      description: Model initialization and minibatch seed shared by every candidate.
    task:
      type: string
      default: |
        Find the smallest network by trainable parameter count with mean MNIST CV accuracy
        >= {{ input.target_accuracy }}. Search for up to {{ input.max_seconds }} seconds,
        at most {{ input.max_trials }} recipes, and at most {{ input.max_epochs }} epochs per fold.
        Every recipe uses {{ input.cv_method }} with {{ input.cv_folds }} folds or holdout
        fraction {{ input.validation_fraction }}, repeated {{ input.cv_repeats }} times on
        {{ input.samples }} examples. Split seed is {{ input.cv_seed }}; training seed is
        {{ input.seed }}. Keep shrinking after reaching the target.
  additionalProperties: false
outputs:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required: [target_reached, cv_accuracy, parameter_count, trials_attempted, stop_reason]
  properties:
    target_reached:
      type: boolean
    cv_accuracy:
      type: [number, "null"]
      minimum: 0
      maximum: 1
    parameter_count:
      type: [integer, "null"]
      minimum: 1
    trials_attempted:
      type: integer
      minimum: 0
    stop_reason:
      enum: [wall_clock, trial_budget, diminishing_returns]
  additionalProperties: false
tools:
  source: tools.py
  built_in: true
  register:
    design_network: ~
    profile_network:
      volatile: true
    evaluate_network:
      volatile: true
    finish_search:
      storable: false
